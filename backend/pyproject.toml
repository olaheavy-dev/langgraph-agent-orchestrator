[project]
name = "orchestrator"
version = "0.1.0"
description = "A LangGraph orchestrator that routes between a chat agent, a retrieval agent, and a coding agent with human approval."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langchain[openai]>=1.3.15",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.2.3",
    # InMemoryVectorStore computes cosine similarity with numpy.
    "numpy>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.9", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
